name: Fixture CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate fixture source
        shell: bash
        run: |
          test -s calculator.ts
          grep -Eq '^export (\{\};|function subtract\(a: number, b: number\): number \{)$' calculator.ts
          test "$(wc -l < calculator.ts)" -le 5
          git diff --check
