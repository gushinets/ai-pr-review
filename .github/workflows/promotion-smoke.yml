name: Token Plan promotion smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
      - name: Install reviewer search binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep fd-find
          rg --version
          fdfind --version
      - run: npm ci
      - run: npm run build
      - run: npm run test:security
      - run: npm run cli:promotion-smoke
        env:
          QWEN_TOKEN_PLAN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_API_KEY }}
